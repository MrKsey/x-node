<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{host}} · 401 Unauthorized</title>
<style>
  :root {
    color-scheme: {{theme}};
    --bg: {{bg}};
    --panel: {{panel}};
    --border: {{border}};
    --fg: {{fg}};
    --muted: {{muted}};
    --accent: {{accent}};
    --accent-soft: {{accent_soft}};
    --accent-line: {{accent_line}};
    --ok: {{ok}};
    --grid: {{grid}};
    --code-bg: {{code_bg}};
    --shadow: {{shadow}};
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(760px 380px at 50% -8%, var(--accent-soft), transparent 72%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--bg);
    color: var(--fg);
    font: 14px/1.5 {{font}};
    -webkit-font-smoothing: antialiased;
  }
  body.v-left { justify-content: flex-start; padding-left: max(32px, 8vw); }
  .card {
    width: min(620px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 30px 90px var(--shadow);
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .mark {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-line);
    font: 600 10px/1 {{mono}};
    letter-spacing: .04em;
  }
  .host {
    font: 500 12.5px/1 {{mono}};
    color: var(--muted);
    letter-spacing: .01em;
  }
  .badge {
    margin-left: auto;
    padding: 5px 10px;
    border-radius: 999px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    font: 600 11px/1 {{mono}};
    letter-spacing: .03em;
  }
  .body { padding: 26px 22px 24px; }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  p {
    margin: 6px 0 18px;
    font-size: 13px;
    color: var(--muted);
  }
  pre {
    margin: 0;
    padding: 18px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 11px;
    font: 13px/1.75 {{mono}};
    overflow-x: auto;
  }
  .k, .p { color: var(--muted); }
  .v { color: var(--accent); }
  .s { color: var(--ok); }
  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font: 11px/1.4 {{mono}};
    color: var(--muted);
  }
  .foot span { white-space: nowrap; }
  @media (max-width: 520px) {
    body { padding: 18px; }
    body.v-left { padding-left: 18px; }
    .body { padding: 22px 18px 20px; }
  }
</style>
</head>
<body class="{{body_class}}">
<main class="card">
  <div class="bar">
    <span class="mark">{{mark}}</span>
    <span class="host">{{host}}</span>
    <span class="badge">HTTP 401</span>
  </div>
  <div class="body">
    <h1>401 Unauthorized</h1>
    <p>The request did not carry valid credentials.</p>
    <pre>{
  <span class="k">"status"</span><span class="p">:</span>     <span class="v">"UNAUTHORIZED"</span>,
  <span class="k">"timestamp"</span><span class="p">:</span>  <span class="s">"{{timestamp}}"</span>,
  <span class="k">"request_id"</span><span class="p">:</span> <span class="s">"{{request_id}}"</span>
}</pre>
  </div>
  <div class="foot">
    <span>node {{node}}</span>
    <span>build {{build}}</span>
    <span>deployed {{deployed}}</span>
    <span>{{subtitle}}</span>
  </div>
</main>
</body>
</html>
