name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Alfis source that is built into the release archives. The web UI was
  # added after the v0.10.0 release, so the build uses a pinned upstream commit;
  # the Cargo version is still 0.10.0.
  ALFIS_VERSION: "0.10.0"
  ALFIS_REF: "4427af35fc138a6b05cc9a9ebe11da3631cae15a"

jobs:
  build:
    name: package linux/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            goarm: ""
          - goarch: arm64
            goarm: ""
          - goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Revertron/Alfis
          ref: ${{ env.ALFIS_REF }}
          path: alfis-src

      - uses: actions/setup-go@v5
        with:
          # The probe is a separate module with the newer language requirement.
          go-version-file: cmd/x-node-peerprobe/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/x-node-peerprobe/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alfis-src -> target
          key: alfis-${{ matrix.goarch }}

      - name: build Alfis with the web UI
        working-directory: alfis-src
        run: |
          set -euo pipefail
          case "${{ matrix.goarch }}" in
            amd64) target=x86_64-unknown-linux-musl ;;
            arm64) target=aarch64-unknown-linux-musl ;;
            arm)   target=armv7-unknown-linux-musleabihf ;;
            *) echo "unsupported architecture: ${{ matrix.goarch }}" >&2; exit 1 ;;
          esac
          # The upstream nogui builds use --no-default-features without webui.
          # The dashboard links to the Alfis panel, so the bundled build keeps
          # the web UI and drops only the desktop GUI.
          cross build --release --no-default-features --features=webui,doh --target "$target"
          mkdir -p "$RUNNER_TEMP/alfis"
          install -m 0755 "target/$target/release/alfis" "$RUNNER_TEMP/alfis/alfis"

      - name: package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="$PWD"
          name="x-node-${version}-linux-${{ matrix.goarch }}"
          stage="$root/dist/${name}"
          mkdir -p "$stage/bin"

          ldflags="-s -w -X main.daemonVersion=${version}"
          go build -trimpath -ldflags "$ldflags" -o "$stage/bin/x-node" ./cmd/x-node
          (
            cd cmd/x-node-peerprobe
            go build -trimpath -ldflags "-s -w" -o "$stage/bin/x-node-peerprobe" .
          )
          install -m 0755 "$RUNNER_TEMP/alfis/alfis" "$stage/bin/alfis"

          install -m 0755 install.sh uninstall.sh "$stage/"
          install -m 0644 config.example.json README.md README.ru.md LICENSE SECURITY.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$stage/"
          cp -r deploy "$stage/deploy"
          find "$stage/deploy" -type d -exec chmod 0755 {} +
          find "$stage/deploy" -type f -exec chmod 0644 {} +

          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          rm -rf "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: fetch the bundled Alfis source
        run: |
          set -euo pipefail
          # The archives bundle an Alfis binary built from this commit. Alfis is
          # AGPL-3.0, so the corresponding source is published next to it.
          curl -fsSL -o "dist/alfis-${ALFIS_VERSION}-${ALFIS_REF}-source.tar.gz" \
            "https://github.com/Revertron/Alfis/archive/${ALFIS_REF}.tar.gz"

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: verify the archives
        run: |
          set -euo pipefail
          for archive in dist/x-node-*.tar.gz; do
            # Read the whole listing first: grep -q closes the pipe early and
            # tar then fails with "stdout: write error" under pipefail.
            listing="$(tar -tzf "$archive")"
            printf '%s\n' "$listing" | grep -qx '.*/install.sh'
            printf '%s\n' "$listing" | grep -qx '.*/bin/x-node'
            printf '%s\n' "$listing" | grep -qx '.*/bin/alfis'
            printf '%s\n' "$listing" | grep -qx '.*/deploy/systemd/x-node.service'
            echo "$listing" | grep -qx '.*/deploy/systemd/x-node-helper.service'
          done

      - name: release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section of this version is what users read on the
          # release page: every release must say in a few lines what changed,
          # so a missing section stops the publish instead of shipping an
          # auto-generated commit list.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          # GitHub renders every newline inside a release body as a hard break,
          # so a bullet wrapped in the changelog would show up as a narrow
          # column on the release page instead of using the full width.
          if grep -nE '^[[:space:]]+[^[:space:]-]' release-notes.md; then
            echo "CHANGELOG.md wraps the ${version} section: keep each bullet on one line" >&2
            exit 1
          fi
          cat release-notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "X-Node ${version}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt \
              --title "X-Node ${version}" \
              --notes-file release-notes.md
          fi
